services:
  bot:
    build: .
    container_name: macrotracker
    restart: unless-stopped
    env_file: .env
    environment:
      DB_PATH: /data/user_data.db
    volumes:
      - ./data:/data
      - ./credentials.json:/app/credentials.json:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
