# Paths are relative to this file (deploy/). Run from the project root with
#   docker compose -f deploy/docker-compose.yml <command>
# or from inside deploy/ with plain `docker compose <command>`.
name: macrotracker

services:
  bot:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: macrotracker
    restart: unless-stopped
    env_file: ../secrets/.env
    environment:
      DB_PATH: /data/user_data.db
    volumes:
      - ../data:/data
      - ../secrets/credentials.json:/app/secrets/credentials.json:ro
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
